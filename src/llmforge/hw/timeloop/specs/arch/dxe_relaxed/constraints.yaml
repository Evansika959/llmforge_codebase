constraints:
  # DXE constraints: forced spatial factors on the DXT/VAC/mac_lane mesh.
  #
  # Weights flow through DRAM like every other dataspace. An earlier version
  # bypassed Weights, which assumed every layer fits in the 3MB WMEM. That
  # does not hold for the 100M+ parameter models searched here, so weights
  # are modeled through DRAM at this parameter scale.
  #
  # Spatial utilization:
  #   DXT meshX=8:      D=8  (8 output-channel groups)
  #   VAC meshY=16:     D=16 (16 output channels per DXT)
  #   mac_lane meshX=16: E=16 (16-wide reduction)
  #   Total: D=128, E=16 → 2048 MACs
  version: 0.4
  targets:
    # DRAM: keep all three dataspaces. Weights flow through DRAM like
    # Inputs and Outputs because model parameters exceed WMEM at scale.
    - target: DRAM
      type: dataspace
      keep: [Inputs, Outputs, Weights]
    - target: DRAM
      type: temporal
      permutation: [E, D, L]
    - target: global_sram
      type: temporal
      permutation: [L, E, D]
    - target: head_sram
      type: temporal
      permutation: [E, D, L]
    # Force full spatial utilization
    - target: DXT
      type: spatial
      factors: [N=1, E=1, L=1, R=1, S=1, Q=1, D=8]
    - target: VAC
      type: spatial
      factors: [N=1, E=1, L=1, Q=1, R=1, S=1, D=16]
    - target: mac_lane
      type: spatial
      factors: [N=1, D=1, L=1, R=1, S=1, Q=1, E=16]
