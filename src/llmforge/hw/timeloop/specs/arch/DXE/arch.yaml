architecture:
  # =========================================================================
  # rDXE single-chip decoder engine (DXE), weight-stationary dataflow
  # Reference: withheld for anonymous review
  #
  # Design envelope of the reference configuration:
  #   embedding size up to 512, context up to 256 tokens (512 with GQA)
  #   up to 4 concurrent requests
  #
  # Compute: 8 DXT x 16 VAC x 16 MAC = 2048 INT8 MACs
  #   Peak: 819.2 GOPS at 200 MHz
  #
  # On-chip SRAM: 4.00 MB total
  #   WMEM:  3.00 MB (128 cores x 24 KB)
  #   KV$:   1.00 MB (128 cores x 8 KB)
  #   Head SRAM: 4 KB (8 DXTs x 512 B)
  #   Global SRAM: 512 B | Residual SRAM: 512 B
  #   Abuf: 4 KB registers (8 DXTs x 512 B)
  #
  # SRAM macros per core: 6
  #   2 x (64b x 512) for attention weights, power-gated
  #   2 x (64b x 1024) for FFN weights, power-gated
  #   2 x (64b x 512) for the KV cache, with bit-write enable
  #
  # Features NOT modeled in Timeloop:
  #   - VRC (fused Softmax/RMSNorm with GEMV)
  #   - iWuR asymmetric KV cache access
  #   - GQA via VLINK reconfiguration
  #   - Ring-topology multi-DXE pipeline
  #   - WMEM attn/FFN bank-level power gating
  #   - Residual connection datapath
  # =========================================================================
  version: 0.4
  nodes:

  # =============================================
  # Top-Level System
  # =============================================
  - !Container
    name: system
    attributes:
      technology: "16nm"

  # =============================================
  # DRAM — Off-Chip (I/O constrained)
  # =============================================
  # Weights loaded once at init via 16-ch quad-SPI (800 Mb/s).
  # Zero DRAM access during decode inference.
  - !Component
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 64
      datawidth: 8
      read_bandwidth: 2
      write_bandwidth: 2

  # =============================================
  # DXE Container
  # =============================================
  - !Container
    name: DXE
    attributes:
      technology: "16nm"

  # =============================================
  # Global SRAM — DXE-Level Input Buffer
  # =============================================
  # Depth: 32
  # Width: 128b (16 MACs x 8-bit data)
  # Physical: 1 dual-port SRAM macro
  # Size: 32 × 16 B = 512 B
  # Holds one d_model=512 embedding vector.
  # Broadcast to all 8 DXTs.
  - !Component
    name: global_sram
    class: smartbuffer_SRAM
    attributes:
      depth: 32
      width: 128
      n_banks: 1
      datawidth: 8
      read_bandwidth: 16
      write_bandwidth: 16
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  # =============================================
  # DXT Array — 8 Heads
  # =============================================
  # Each DXT handles one attention head's compute.
  # Spatial: partition output dimension (E) across DXTs.
  - !Container
    name: DXT
    spatial: {meshX: 8}
    constraints:
      spatial:
        permutation: [N, E, L, R, S, Q, D]
        factors: [N=1, D=1, L=1, R=1, S=1, Q=1]
        split: 999

  # =============================================
  # Head SRAM — Per-DXT Row-Reuse Buffer
  # =============================================
  # Depth: 32
  # Width: 128b | Physical: 1 dual-port SRAM macro
  # Size: 32 × 16 B = 512 B per DXT
  # Supports broadcast (attention) and unicast (projection) modes.
  - !Component
    name: head_sram
    class: smartbuffer_SRAM
    attributes:
      depth: 32
      width: 128
      n_banks: 1
      datawidth: 8
      read_bandwidth: 8
      write_bandwidth: 8
    constraints:
      dataspace: {keep: [Inputs, Outputs], bypass: [Weights]}

  # =============================================
  # VAC Array — 16 Cores per DXT
  # =============================================
  # Connected via:
  #   HLINK — systolic input datapath between cores
  #   GBUS — 32-bit bus, FIFO depth 28, round-robin arbiter
  - !Container
    name: VAC
    spatial: {meshY: 16}
    constraints:
      spatial:
        split: 0
        permutation: [N, L, Q, R, S, E, D]
        factors: [N=1, L=1, Q=1, R=1, S=1, D=1]

  # =============================================
  # Per-Core Storage (Parallel Buffers)
  # =============================================
  - !Parallel
    nodes:
    # -------------------------------------------
    # WMEM — Weight Memory (24 KB per core)
    # -------------------------------------------
    # Depth: 1536
    # Split into two physical banks:
    #   attention bank: 2 x (64b x 512) = 8 KB
    #     addr 0–511: QKV projection + output projection
    #   FFN bank: 2 x (64b x 1024) = 16 KB
    #     addr 512–1535: FFN0 + FFN1
    # Independent deep-sleep power gating per bank.
    # Total: 1536 × 128b = 24 KB/core, 3.00 MB/DXE
    # 4 physical SRAM macros, all single-port with BWE.
    - !Component
      name: wmem
      class: smartbuffer_SRAM
      attributes:
        depth: 1536
        width: 128
        n_banks: 2
        datawidth: 8
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {keep: [Weights]}
        temporal:
          permutation: [N, D, L, Q, S, E, R]
          factors: [N=1, D=1, L=1, Q=1, S=1]

    # -------------------------------------------
    # KV Cache (8 KB per core)
    # -------------------------------------------
    # Depth per user: 128
    # Physical depth: 128 × 4 users = 512
    # Width: 128b (2 macros of 64b)
    # Size: 512 × 16 B = 8 KB/core, 1.00 MB/DXE
    #
    # Internal: 16 banks, one per MAC
    # iWuR: K stored row-by-row, V stored column-by-column
    # GQA via VLINK: even/odd head pairs share KV
    #
    # BYPASSED for GEMM. Active for attention (Q×K, P×V).
    - !Component
      name: kv_cache
      class: smartbuffer_SRAM
      attributes:
        depth: 512
        width: 128
        n_banks: 2
        datawidth: 8
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {bypass: [Inputs, Weights, Outputs]}

    # -------------------------------------------
    # Accumulator (register-based)
    # -------------------------------------------
    # Output width: 8*2 + clog2(16) + 5 = 25 bits
    # Small register accumulator for partial sums.
    # Results sent via GBUS (32-bit) for inter-core reduction.
    - !Component
      name: acc_buffer
      class: smartbuffer_RF
      attributes:
        depth: 16
        width: 32
        update_fifo_depth: 2
        datawidth: 16
        read_bandwidth: 2
        write_bandwidth: 2
      constraints:
        dataspace: {keep: [Outputs]}
        temporal:
          permutation: [N, E, L, Q, R, S, D]
          factors: [N=1, E=1, R=1, S=1, L=1, Q=1]

    # -------------------------------------------
    # Inputs pass-through
    # -------------------------------------------
    # Inputs flow via head_sram/global_sram broadcast,
    # not stored in per-core parallel buffers.
    - !Nothing {constraints: {dataspace: {keep: [Inputs]}}}

  # =============================================
  # MAC Lane — 16 Multipliers per Core
  # =============================================
  # 16 parallel INT8 multiplies per cycle.
  # Partitions reduction dimension (D).
  # Total: 8 × 16 × 16 = 2048 MACs per DXE.
  - !Container
    name: mac_lane
    spatial: {meshX: 16}
    constraints:
      spatial:
        permutation: [D, N, E, L, R, S, Q]
        factors: [N=1, E=1, L=1, R=1, S=1, Q=1]
        split: 999

  # =============================================
  # MAC Unit
  # =============================================
  # INT8 multiply, INT16 accumulate (25b internal)
  - !Component
    name: mac
    class: intmac
    attributes:
      multiplier_width: 8
      adder_width: 16