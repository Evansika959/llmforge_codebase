[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmforge"
version = "0.2.0"
description = "Hardware-aware architecture search for edge language models over trained elastic supernets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
# Elastic supernets: training, slice scoring, extraction. The elastic forwards patch Hugging Face
# attention internals, so transformers stays on the tested minor version.
supernet = ["torch>=2.3", "transformers>=4.53,<4.54", "safetensors>=0.4", "pyarrow>=14", "datasets>=2.19"]
# GPU target. Also needs the pinned ReaLLM-Forge checkout, see scripts/setup/fetch_third_party.sh.
zeus = ["torch>=2.3", "zeus>=0.10"]
# Pixel Watch 5 predictor and its active-learning method.
device = ["xgboost>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "pandas>=2.0"]
# Timeloop substrates need timeloopfe and the Timeloop binaries, see docs/hw_simulators.md.
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmforge.hw.timeloop" = ["specs/**/*.yaml"]
"llmforge.hw.rdxe" = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
