# Elastic search space over the smollm2-360m supernet, partition 'blocks'.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 20. Size: 10^11.42 architectures.
base_model: smollm2-360m
hf_repo: HuggingFaceTB/SmolLM2-360M
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
knobs:
  n_head: [5, 10, 15]
  n_qk_head_dim: [16, 32, 48, 64]
  n_v_head_dim: [16, 32, 48, 64]
  mlp_size: [640, 1280, 1920, 2560]
fixed: {n_layer: 32, n_embd: 960, n_kv_group: 5, vocab_size: 49152, tie_embeddings: true,
  family: llama, attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 6]
  - [6, 12]
  - [12, 19]
  - [19, 25]
  - [25, 32]
  mlp:
  - [0, 6]
  - [6, 12]
  - [12, 19]
  - [19, 25]
  - [25, 32]
