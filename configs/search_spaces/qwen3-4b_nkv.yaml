# Elastic search space over the qwen3-4b supernet, partition 'blocks', KV groups elastic.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 24. Size: 10^14.31 architectures.
base_model: qwen3-4b
hf_repo: Qwen/Qwen3-4B-Base
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
knobs:
  n_head: [4, 8, 16, 32]
  n_kv_group: [1, 2, 4, 8]
  n_qk_head_dim: [32, 64, 96, 128]
  n_v_head_dim: [32, 64, 96, 128]
  mlp_size: [2432, 4864, 7296, 9728]
fixed: {n_layer: 36, n_embd: 2560, vocab_size: 151936, tie_embeddings: true, family: qwen3,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 1]
  - [1, 12]
  - [12, 22]
  - [22, 25]
  - [25, 36]
  mlp:
  - [0, 1]
  - [1, 4]
  - [4, 34]
  - [34, 36]
