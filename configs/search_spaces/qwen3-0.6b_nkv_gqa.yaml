# Elastic search space over the qwen3-0.6b supernet, partition 'blocks', KV groups elastic, query/key and value dimensions fixed at the base head dimension.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 25. Size: 10^8.58 architectures.
base_model: qwen3-0.6b
hf_repo: Qwen/Qwen3-0.6B-Base
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
gqa_dims: true
knobs:
  n_head: [2, 4, 8, 16]
  n_kv_group: [1, 2, 4, 8]
  n_qk_head_dim: [128]
  n_v_head_dim: [128]
  mlp_size: [768, 1536, 2304, 3072]
fixed: {n_layer: 28, n_embd: 1024, vocab_size: 151936, tie_embeddings: true, family: qwen3,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
  mlp:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
