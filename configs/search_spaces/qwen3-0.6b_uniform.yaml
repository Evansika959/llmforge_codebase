# Elastic search space over the qwen3-0.6b supernet, partition 'uniform'.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 4. Size: 10^2.11 architectures.
base_model: qwen3-0.6b
hf_repo: Qwen/Qwen3-0.6B-Base
partition: uniform
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
knobs:
  n_head: [8, 16]
  n_qk_head_dim: [32, 64, 96, 128]
  n_v_head_dim: [32, 64, 96, 128]
  mlp_size: [768, 1536, 2304, 3072]
fixed: {n_layer: 28, n_embd: 1024, n_kv_group: 8, vocab_size: 151936, tie_embeddings: true,
  family: qwen3, attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 28]
  mlp:
  - [0, 28]
