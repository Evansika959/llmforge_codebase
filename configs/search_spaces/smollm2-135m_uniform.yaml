# Elastic search space over the smollm2-135m supernet, partition 'uniform'.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 4. Size: 10^2.28 architectures.
base_model: smollm2-135m
hf_repo: HuggingFaceTB/SmolLM2-135M
partition: uniform
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
knobs:
  n_head: [3, 6, 9]
  n_qk_head_dim: [16, 32, 48, 64]
  n_v_head_dim: [16, 32, 48, 64]
  mlp_size: [384, 768, 1152, 1536]
fixed: {n_layer: 30, n_embd: 576, n_kv_group: 3, vocab_size: 49152, tie_embeddings: true,
  family: llama, attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 30]
  mlp:
  - [0, 30]
