# Elastic search space over the smollm2-360m supernet, partition 'blocks', Flextron-style: only query heads and MLP width elastic, KV groups fixed at 5, head dimensions fixed at the base head dimension.
# Search-space attribution ablation derived from smollm2-360m_nkv.yaml.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 25. Size: 10^5.40 architectures.
base_model: smollm2-360m
hf_repo: HuggingFaceTB/SmolLM2-360M
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
gqa_dims: true
grid_subset:
  n_kv_group: [5]
knobs:
  n_head: [5, 10, 15]
  n_kv_group: [5]
  n_qk_head_dim: [64]
  n_v_head_dim: [64]
  mlp_size: [640, 1280, 1920, 2560]
fixed: {n_layer: 32, n_embd: 960, vocab_size: 49152, tie_embeddings: true, family: llama,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 6]
  - [6, 12]
  - [12, 19]
  - [19, 25]
  - [25, 32]
  mlp:
  - [0, 6]
  - [6, 12]
  - [12, 19]
  - [19, 25]
  - [25, 32]
