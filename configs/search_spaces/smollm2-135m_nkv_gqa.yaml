# Elastic search space over the smollm2-135m supernet, partition 'blocks', KV groups elastic, query/key and value dimensions fixed at the base head dimension.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 25. Size: 10^6.90 architectures.
base_model: smollm2-135m
hf_repo: HuggingFaceTB/SmolLM2-135M
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
gqa_dims: true
knobs:
  n_head: [3, 6, 9]
  n_kv_group: [1, 3]
  n_qk_head_dim: [64]
  n_v_head_dim: [64]
  mlp_size: [384, 768, 1152, 1536]
fixed: {n_layer: 30, n_embd: 576, vocab_size: 49152, tie_embeddings: true, family: llama,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 6]
  - [6, 12]
  - [12, 18]
  - [18, 24]
  - [24, 30]
  mlp:
  - [0, 6]
  - [6, 12]
  - [12, 18]
  - [18, 24]
  - [24, 30]
