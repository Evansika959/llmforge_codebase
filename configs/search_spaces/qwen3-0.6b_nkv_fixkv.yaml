# Elastic search space over the qwen3-0.6b supernet, partition 'blocks', KV groups not searched: n_kv = min(n_h, 8) in every block (base 8; n_h 2 and 4 cannot hold 8).
# Search-space attribution ablation derived from qwen3-0.6b_nkv.yaml.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 25. Size: 10^12.04 architectures.
base_model: qwen3-0.6b
hf_repo: Qwen/Qwen3-0.6B-Base
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
kv_cap: 8
knobs:
  n_head: [2, 4, 8, 16]
  n_kv_group: [2, 4, 8]
  n_qk_head_dim: [32, 64, 96, 128]
  n_v_head_dim: [32, 64, 96, 128]
  mlp_size: [768, 1536, 2304, 3072]
fixed: {n_layer: 28, n_embd: 1024, vocab_size: 151936, tie_embeddings: true, family: qwen3,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
  mlp:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
