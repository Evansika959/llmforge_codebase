# Elastic search space over the qwen3-1.7b supernet, partition 'blocks'.
# Generated by `python -m llmforge.search.elastic_space --write-configs`.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 20. Size: 10^10.54 architectures.
base_model: qwen3-1.7b
hf_repo: Qwen/Qwen3-1.7B-Base
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
knobs:
  n_head: [8, 16]
  n_qk_head_dim: [32, 64, 96, 128]
  n_v_head_dim: [32, 64, 96, 128]
  mlp_size: [1536, 3072, 4608, 6144]
fixed: {n_layer: 28, n_embd: 2048, n_kv_group: 8, vocab_size: 151936, tie_embeddings: true,
  family: qwen3, attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
  mlp:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
