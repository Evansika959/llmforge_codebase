# Elastic search space over the qwen3-0.6b supernet, partition 'blocks', Flextron-style: only query heads and MLP width elastic, n_kv = min(n_h, 8), head dimensions fixed at the base head dimension.
# Search-space attribution ablation derived from qwen3-0.6b_nkv.yaml.
# Loading validates grids and blocks against the supernet ModelSpec.
# Genes: 25. Size: 10^6.02 architectures.
base_model: qwen3-0.6b
hf_repo: Qwen/Qwen3-0.6B-Base
partition: blocks
n_blocks: 5
block_size: 1024
mutation_step_prob: 0.7
with_nkv: true
gqa_dims: true
kv_cap: 8
knobs:
  n_head: [2, 4, 8, 16]
  n_kv_group: [2, 4, 8]
  n_qk_head_dim: [128]
  n_v_head_dim: [128]
  mlp_size: [768, 1536, 2304, 3072]
fixed: {n_layer: 28, n_embd: 1024, vocab_size: 151936, tie_embeddings: true, family: qwen3,
  attention_variant: infinite, mlp_variant: swiglu}
blocks:
  attn:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
  mlp:
  - [0, 5]
  - [5, 11]
  - [11, 16]
  - [16, 22]
  - [22, 28]
