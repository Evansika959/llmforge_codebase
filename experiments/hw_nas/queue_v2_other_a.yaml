    out: runs_v2/search/tl-flat__smollm2-360m_nkv__grid
- name: proxy-params__smollm2-360m_nkv__nsga2__s0
  args:
    hw: analytic
    algo: nsga2
    pop: 32
    generations: 25
    objectives:
    - val_loss
    - params_M
    space: smollm2-360m_nkv
    supernet: nkv_sl360_new
    out: runs_v2/search/proxy-params__smollm2-360m_nkv__nsga2__s0
- name: proxy-flops__smollm2-360m_nkv__nsga2__s0
  args:
    hw: analytic
    algo: nsga2
    pop: 32
    generations: 25
    objectives:
    - val_loss
    - flops_per_token
    analytic_seq_len: 512
    space: smollm2-360m_nkv
    supernet: nkv_sl360_new
    out: runs_v2/search/proxy-flops__smollm2-360m_nkv__nsga2__s0
