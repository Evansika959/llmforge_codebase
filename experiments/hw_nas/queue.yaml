#   - name: gpu-decode__qwen3-4b__remeasure__nsga2-s0
#     args: {<<: *gpu_decode, space: qwen3-4b, partition: per_layer, supernet: qwen3-4b_ab_blocks, algo: list, archs: runs/search/gpu__qwen3-4b__nsga2__s0/front.json}

#   # ---- Phase 7: qwen3-0.6b, checkpoint confirmed by Phase 0 before start ----
#   - name: proxy-params__qwen3-0.6b__nsga2__s0
#     args: {<<: *proxy_params, space: qwen3-0.6b, supernet: qw06_cont}
#   - name: proxy-flops__qwen3-0.6b__nsga2__s0
#     args: {<<: *proxy_flops, space: qwen3-0.6b, supernet: qw06_cont}
