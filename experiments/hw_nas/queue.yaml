#     args: {<<: *gpu, space: qwen3-0.6b, partition: per_layer, supernet: qw06_cont, algo: list, archs: runs/search/proxy-flops__qwen3-0.6b__nsga2__s0/front.json}
#   - name: gpu-decode__qwen3-0.6b__remeasure__nsga2-s0
